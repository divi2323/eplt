<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2b1d"/>
      <stop offset="1" stop-color="#04130c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7d36b"/>
      <stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- outer ring -->
  <circle cx="256" cy="256" r="238" fill="url(#g)" stroke="url(#gold)" stroke-width="18" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="205" fill="#061a10" stroke="#1b5a3f" stroke-width="6"/>

  <!-- jester cap -->
  <path d="M140 230 C170 140, 235 140, 256 190 C277 140, 342 140, 372 230 C330 215, 300 235, 256 230 C212 235, 182 215, 140 230 Z" fill="#0e3a28" stroke="#1fe18b" stroke-opacity="0.25" stroke-width="6"/>
  <path d="M140 230 C170 170, 235 160, 256 205 C277 160, 342 170, 372 230" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>

  <!-- bells -->
  <circle cx="140" cy="230" r="16" fill="url(#gold)"/>
  <circle cx="372" cy="230" r="16" fill="url(#gold)"/>
  <circle cx="256" cy="182" r="16" fill="url(#gold)"/>

  <!-- central chip -->
  <circle cx="256" cy="310" r="118" fill="#071b12" stroke="#0f3b28" stroke-width="10"/>
  <circle cx="256" cy="310" r="92" fill="#06160e" stroke="#184f37" stroke-width="6" stroke-dasharray="10 10"/>

  <!-- suits (proper colors) -->
  <!-- heart (red) -->
  <path d="M256 295 C246 280, 220 278, 220 302 C220 324, 242 335, 256 349 C270 335, 292 324, 292 302 C292 278, 266 280, 256 295 Z" fill="#e11d48"/>
  <!-- spade (black) -->
  <path d="M210 320 C210 290, 256 260, 256 240 C256 260, 302 290, 302 320 C302 346, 280 360, 256 340 C232 360, 210 346, 210 320 Z" fill="#0b0b0f" opacity="0.95"/>
  <rect x="246" y="338" width="20" height="34" rx="6" fill="#0b0b0f" opacity="0.95"/>
  <!-- diamond (blue) -->
  <path d="M256 252 L286 310 L256 368 L226 310 Z" fill="#2563eb" opacity="0.95"/>
  <!-- club (green) -->
  <circle cx="235" cy="292" r="18" fill="#22c55e"/>
  <circle cx="277" cy="292" r="18" fill="#22c55e"/>
  <circle cx="256" cy="322" r="18" fill="#22c55e"/>
  <rect x="248" y="332" width="16" height="42" rx="6" fill="#16a34a"/>

  <!-- banner text -->
  <path d="M130 420 C180 392, 332 392, 382 420 L362 462 C320 440, 192 440, 150 462 Z" fill="#0b2b1d" stroke="url(#gold)" stroke-width="6"/>
  <text x="256" y="445" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="28" font-weight="900" fill="#f7e7b0" letter-spacing="2">ELITE LEAGUE</text>
</svg>
